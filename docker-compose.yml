# Chạy thử trợ lý độc lập: Postgres (pgvector) + assistant-service, công cụ tra cứu dùng fixture (không cần backend).
#   cp .env.example .env && docker compose up -d --build
#   docker compose run --rm assistant-service kb-import --publish --allow-todo
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - assistant_pg:/var/lib/postgresql/data

  assistant-service:
    build:
      context: .
      dockerfile: assistant-service/Dockerfile
    depends_on: [postgres]
    restart: on-failure
    environment:
      ASSISTANT_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/assistant
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_INTERNAL_TOKEN:?ASSISTANT_INTERNAL_TOKEN must be set}
      ASSISTANT_TOOLS_MODE: ${ASSISTANT_TOOLS_MODE:-mock}
      ASSISTANT_LLM_PROVIDER: ${ASSISTANT_LLM_PROVIDER:-scripted}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ASSISTANT_EMBEDDING_PROVIDER: fake
    ports:
      - "${ASSISTANT_PORT:-8100}:8100"

volumes:
  assistant_pg:
