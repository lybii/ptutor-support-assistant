spring:
  application:
    name: ptutor-assistant-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ptutor}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ptutor
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT8H}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088}
  assistant-service:
    enabled: ${APP_ASSISTANT_ENABLED:true}
    base-url: ${APP_ASSISTANT_SERVICE_BASE_URL:http://127.0.0.1:8100}
    internal-token: ${APP_ASSISTANT_SERVICE_INTERNAL_TOKEN:}
    timeout-ms: ${APP_ASSISTANT_TIMEOUT_MS:30000}
    rate-limit:
      messages: ${APP_ASSISTANT_RATE_LIMIT_MESSAGES:20}
      window-seconds: ${APP_ASSISTANT_RATE_LIMIT_WINDOW_SECONDS:300}
  demo:
    # Mật khẩu chung của các tài khoản demo; trống thì không tạo tài khoản.
    user-password: ${DEMO_USER_PASSWORD:}
